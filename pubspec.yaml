name: smart_medicine_reminder
description: Smart Medicine Reminder App
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Local Storage
  shared_preferences: ^2.2.3

  # Fonts
  google_fonts: ^6.2.1

  # Date & Time
  intl: ^0.19.0

  # Firebase
  firebase_core: ^3.15.2
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.2

  # Image picker
  image_picker: ^1.1.2

  # Local notifications
  flutter_local_notifications: ^17.2.0
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.jpg